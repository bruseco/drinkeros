name: Validate application
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:financial-db
      - run: node scripts/test-event-shopping-db.mjs
      - run: node scripts/test-favorite-collections-db.mjs
      - run: node scripts/test-required-favorite-lists-db.mjs
      - run: node scripts/test-public-club-offer-db.mjs
      - run: node scripts/test-quiz-answer-metrics-db.mjs
      - run: node scripts/test-funnel-custom-period-db.mjs
      - run: node scripts/test-club-purchase-funnel-db.mjs
      - run: node scripts/test-club-ab-purchases-db.mjs
      - run: node scripts/test-club-guest-checkout-db.mjs
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/rand-financial-closing/index.ts
      - run: deno check --node-modules-dir=auto --no-lock supabase/functions/create-mp-payment/index.ts supabase/functions/create-mp-subscription/index.ts

      - run: deno check --node-modules-dir=auto --no-lock supabase/functions/club-guest-checkout/index.ts supabase/functions/mercadopago-webhook/index.ts supabase/functions/activate-purchase-account/index.ts
